name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Actions artifact policy
        run: python3 tools/check_artifact_policy.py

      - uses: actions/checkout@v4
        with:
          repository: gravity-zero/mkvgo
          ref: 085894ba0df6d14fb4dc4d41bab9aeb3283b3743
          path: .mkvgo-src

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Inject ASS Workbench MKV bridge
        shell: bash
        run: |
          set -euxo pipefail
          cp tools/mkvgo/ass_replace.go .mkvgo-src/mkv/ops/asswb_replace_ass.go
          cp tools/mkvgo/ass_replace_test.go .mkvgo-src/mkv/ops/asswb_replace_ass_test.go
          python3 tools/mkvgo/patch_upstream_writer.py
          mkdir -p .mkvgo-src/cmd/asswb-mkvgo
          cp tools/mkvgo/bridge_main.go .mkvgo-src/cmd/asswb-mkvgo/main.go

      - name: Test ASS Workbench MKV bridge
        shell: bash
        run: |
          set -euxo pipefail
          cd .mkvgo-src
          go test ./mkv/ops

      - name: Build arm64 MKV bridge
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd .mkvgo-src
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -buildmode=pie -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkvgo.so" ./cmd/asswb-mkvgo
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkvgo.so"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install stable Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" >/dev/null
          test -d "$ANDROID_HOME/platforms/android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Unit tests
        run: gradle :core:domain:test :core:fonts:test :core:container:test --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate deterministic device fixtures
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/generate_device_fixtures.py build/device-fixtures-0.27 | tee build/device-fixtures-0.27.log
          test -f build/device-fixtures-0.27/manifest.txt
          grep -q '^fixture=renderer-risk-extreme-numeric.ass$' build/device-fixtures-0.27/manifest.txt
          grep -q '^fixture=renderer-performance-heavy-move.ass$' build/device-fixtures-0.27/manifest.txt
          grep -q '^fixture=compose-long-event-list.ass$' build/device-fixtures-0.27/manifest.txt

      - name: Validate launcher icon packaging
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'
          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher_round.xml'
          unzip -l "$APK" | grep -q 'res/drawable/ic_launcher_foreground.xml'
          if unzip -l "$APK" | grep -q 'drawable-nodpi-v4/ic_launcher.png'; then
            echo "Legacy launcher PNG unexpectedly packaged" >&2
            exit 1
          fi

      - name: Verify and record build identity
        id: version
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(sed -nE 's/^val baseVersionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          BUILD_CONFIG="app/build/generated/source/buildConfig/debug/io/github/assworkbench/app/BuildConfig.java"
          test -f "$BUILD_CONFIG"
          grep -Fq "VERSION_CODE = $VERSION_CODE" "$BUILD_CONFIG"
          grep -Fq "VERSION_NAME = \"$VERSION\"" "$BUILD_CONFIG"
          grep -Fq "ASSWB_BUILD_COMMIT = \"$SHORT_SHA\"" "$BUILD_CONFIG"
          grep -Fq "ASSWB_BUILD_NUMBER = \"$GITHUB_RUN_NUMBER\"" "$BUILD_CONFIG"

          APK="ASS-Workbench-Android-$VERSION-$SHORT_SHA-debug.apk"
          IDENTITY="ASS-Workbench-Android-$VERSION-$SHORT_SHA-build-identity.txt"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          {
            echo "schema=1"
            echo "version_name=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "commit=$GITHUB_SHA"
            echo "short_commit=$SHORT_SHA"
            echo "workflow=Android CI"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "run_id=$GITHUB_RUN_ID"
            echo "renderer_provider=none"
            echo "renderer_version=0.3.0"
            echo "apk_name=$APK"
            echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          } > "$IDENTITY"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Upload one-day manual diagnostic bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ASS-Workbench-Android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}-manual-debug
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.identity }}
          if-no-files-found: error
          retention-days: 1

      # Release publication is owned by the Fontconfig renderer workflow.
      # Push/PR runs retain no Actions artifact. workflow_dispatch may expose a
      # one-day diagnostic bundle when a short-lived Workflow download is useful.
