name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: gravity-zero/mkvgo
          ref: 085894ba0df6d14fb4dc4d41bab9aeb3283b3743
          path: .mkvgo-src

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Inject ASS Workbench MKV bridge
        shell: bash
        run: |
          set -euxo pipefail
          cp tools/mkvgo/ass_replace.go .mkvgo-src/mkv/ops/asswb_replace_ass.go
          cp tools/mkvgo/ass_replace_test.go .mkvgo-src/mkv/ops/asswb_replace_ass_test.go
          python3 tools/mkvgo/patch_upstream_writer.py
          mkdir -p .mkvgo-src/cmd/asswb-mkvgo
          cp tools/mkvgo/bridge_main.go .mkvgo-src/cmd/asswb-mkvgo/main.go

      - name: Test ASS Workbench MKV bridge
        shell: bash
        run: |
          set -euxo pipefail
          cd .mkvgo-src
          go test ./mkv/ops

      - name: Build arm64 MKV bridge
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd .mkvgo-src
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -buildmode=pie -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkvgo.so" ./cmd/asswb-mkvgo
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkvgo.so"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Unit tests
        run: gradle :core:domain:test :core:fonts:test :core:container:test --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^val baseVersionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "ASS-Workbench-Android-$VERSION-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ASS-Workbench-Android-${{ steps.version.outputs.version }}-debug
          path: ASS-Workbench-Android-${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"
          APK="ASS-Workbench-Android-$VERSION-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "ASS Workbench Android $VERSION" \
              --prerelease \
              --notes "Automated Android debug build from main. This is a test build, not a stable 1.0 release."
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "ASS Workbench Android $VERSION" \
              --prerelease \
              --notes "Automated Android debug build from main. This is a test build, not a stable 1.0 release."
          fi
