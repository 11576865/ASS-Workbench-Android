name: Android Emulator Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Validate Actions artifact policy
        run: python3 tools/check_artifact_policy.py

      - uses: actions/checkout@v4
        with:
          repository: gravity-zero/mkvgo
          ref: 085894ba0df6d14fb4dc4d41bab9aeb3283b3743
          path: .mkvgo-src

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Prepare x86_64 MKV bridge and deterministic fixture
        shell: bash
        run: |
          set -euxo pipefail
          cp tools/mkvgo/ass_replace.go .mkvgo-src/mkv/ops/asswb_replace_ass.go
          python3 tools/mkvgo/patch_upstream_writer.py
          mkdir -p .mkvgo-src/cmd/asswb-mkvgo .mkvgo-src/cmd/asswb-fixture
          cp tools/mkvgo/bridge_main.go .mkvgo-src/cmd/asswb-mkvgo/main.go
          cp tools/mkvgo/android_fixture_main.go .mkvgo-src/cmd/asswb-fixture/main.go

          mkdir -p app/src/debug/jniLibs/x86_64 app/src/androidTest/assets/mkv
          cd .mkvgo-src
          CGO_ENABLED=0 GOOS=android GOARCH=amd64 \
            go build -buildmode=pie -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/debug/jniLibs/x86_64/libmkvgo.so" ./cmd/asswb-mkvgo
          go run ./cmd/asswb-fixture "$GITHUB_WORKSPACE/app/src/androidTest/assets/mkv/source.mkv"
          file "$GITHUB_WORKSPACE/app/src/debug/jniLibs/x86_64/libmkvgo.so"
          test -s "$GITHUB_WORKSPACE/app/src/androidTest/assets/mkv/source.mkv"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-36" "platform-tools" >/dev/null
          test -d "$ANDROID_HOME/platforms/android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Run editor regression suite on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: bash tools/run_emulator_regression.sh

      - name: Summarize instrumentation results
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          RESULT_DIR="app/build/outputs/androidTest-results/connected"
          if [ -d "$RESULT_DIR" ]; then
            find "$RESULT_DIR" -maxdepth 3 -type f -print
            grep -R "tests=" "$RESULT_DIR" || true
          fi
