name: Android Emulator Regression

on:
  push:
    branches: [ main ]
  pull_request:
    # FIXED V1.1 stacked PR #149 targets R3, not main. This is a branch-only
    # opt-in; the production main workflow remains unchanged until merge.
    branches: [ main, feat/r3-fixed-visual-layout-20261014 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Validate Actions artifact policy
        run: python3 tools/check_artifact_policy.py

      - uses: actions/checkout@v4
        with:
          repository: gravity-zero/mkvgo
          ref: 085894ba0df6d14fb4dc4d41bab9aeb3283b3743
          path: .mkvgo-src

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK / NDK packages
        shell: bash
        run: |
          set -euxo pipefail
          NDK_VERSION=29.0.14206865
          sdkmanager "platforms;android-36" "platform-tools" "ndk;$NDK_VERSION" >/dev/null
          test -d "$ANDROID_HOME/platforms/android-36"
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Prepare x86_64 MKV bridge and deterministic fixture
        shell: bash
        run: |
          set -euxo pipefail
          cp tools/mkvgo/ass_replace.go .mkvgo-src/mkv/ops/asswb_replace_ass.go
          python3 tools/mkvgo/patch_upstream_writer.py
          mkdir -p .mkvgo-src/cmd/asswb-mkvgo .mkvgo-src/cmd/asswb-fixture
          cp tools/mkvgo/bridge_main.go .mkvgo-src/cmd/asswb-mkvgo/main.go
          cp tools/mkvgo/android_fixture_main.go .mkvgo-src/cmd/asswb-fixture/main.go

          mkdir -p app/src/debug/jniLibs/x86_64 app/src/androidTest/assets/mkv
          cd .mkvgo-src
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" \
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            go build -buildmode=pie -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/debug/jniLibs/x86_64/libmkvgo.so" ./cmd/asswb-mkvgo
          go run ./cmd/asswb-fixture "$GITHUB_WORKSPACE/app/src/androidTest/assets/mkv/source.mkv"
          file "$GITHUB_WORKSPACE/app/src/debug/jniLibs/x86_64/libmkvgo.so"
          test -s "$GITHUB_WORKSPACE/app/src/androidTest/assets/mkv/source.mkv"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      # Build the exact-head APKs before starting the constrained emulator
      # session. A 180s compile/install window inside the R3 compositor test
      # previously expired while Kotlin instrumentation classes were still
      # compiling, so no actual screenshot test ran.
      - name: Prebuild exact-head app and instrumentation APKs
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Run editor regression suite on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: bash tools/run_emulator_regression.sh

      - name: Summarize instrumentation results
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          RESULT_DIR="app/build/outputs/androidTest-results/connected"
          if [ -d "$RESULT_DIR" ]; then
            find "$RESULT_DIR" -maxdepth 3 -type f -print
            python3 tools/summarize_instrumentation.py "$RESULT_DIR"
          fi

      - name: Upload one-day manual emulator diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: asswb-emulator-diagnostics
          path: diagnostics/instrumentation
          if-no-files-found: warn
          retention-days: 1

  emulator-evidence:
    name: emulator-evidence
    needs: editor-regression
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Read compact evidence from this run attempt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_CONCLUSION: ${{ needs.editor-regression.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Evidence source: repository=$GITHUB_REPOSITORY run=$SOURCE_RUN_ID attempt=$SOURCE_RUN_ATTEMPT sha=$SOURCE_SHA result=$SOURCE_CONCLUSION"
          source_job_id=$(timeout 30s gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "editor-regression") | .id')
          if [[ ! "$source_job_id" =~ ^[0-9]+$ ]]; then
            echo "NO SOURCE JOB: evidence unavailable; no regression pass inferred"
            exit 1
          fi
          echo "Original job: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/job/$source_job_id"
          timeout 90s gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$source_job_id/logs" \
            > "$RUNNER_TEMP/emulator-source-job.log"
          python3 tools/extract_emulator_evidence.py "$RUNNER_TEMP/emulator-source-job.log"

  native-visual-evidence:
    # The editor job can exceed the connector's log response size. Each target
    # bitmap gets its own bounded job, even when unrelated regressions fail.
    name: native-visual-${{ matrix.width }}x${{ matrix.height }}
    needs: editor-regression
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: 1440
            height: 900
          - width: 1024
            height: 768
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Recover and validate full native screenshot
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_CONCLUSION: ${{ needs.editor-regression.result }}
          CAPTURE_WIDTH: ${{ matrix.width }}
          CAPTURE_HEIGHT: ${{ matrix.height }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Native screenshot source: repository=$GITHUB_REPOSITORY run=$SOURCE_RUN_ID attempt=$SOURCE_RUN_ATTEMPT tested_sha=$SOURCE_SHA head_sha=$SOURCE_HEAD_SHA regression=$SOURCE_CONCLUSION"
          source_job_id=$(timeout 30s gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "editor-regression") | .id')
          if [[ ! "$source_job_id" =~ ^[0-9]+$ ]]; then
            echo "NO SOURCE JOB: no screenshot evidence inferred"
            exit 1
          fi
          timeout 90s gh api --allow-escape-sequences \
            "repos/$GITHUB_REPOSITORY/actions/jobs/$source_job_id/logs" \
            > "$RUNNER_TEMP/native-source-job.log"
          python3 tools/emit_native_capture_evidence.py --source-log "$RUNNER_TEMP/native-source-job.log" \
            --width "$CAPTURE_WIDTH" --height "$CAPTURE_HEIGHT"
