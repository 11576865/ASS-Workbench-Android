name: Fontconfig renderer native probe

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/libmpvkt-fontconfig/**'
      - '.github/workflows/fontconfig-native.yml'
      - 'core/fonts/**'
      - 'app/src/main/kotlin/io/github/assworkbench/app/FontStore.kt'
      - 'app/src/main/kotlin/io/github/assworkbench/app/ui/EditorScreen.kt'

permissions:
  contents: read

jobs:
  arm64-fontconfig-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout ASS Workbench
        uses: actions/checkout@v4

      - name: Checkout pinned libmpvKt
        uses: actions/checkout@v4
        with:
          repository: yuroyami/libmpvKt
          ref: v0.3.0
          path: .libmpvkt-src

      - name: Patch libmpvKt for Fontconfig
        run: bash tools/libmpvkt-fontconfig/patch_upstream.sh .libmpvkt-src

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build nasm python3-pip python3-jinja2
          python3 -m pip install --break-system-packages "meson==1.11.0"
          meson --version
          test "$(meson --version)" = "1.11.0"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          NDK_VERSION=29.0.14206865
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          if [ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
            echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          fi

      - name: Fetch pinned native sources
        working-directory: .libmpvkt-src
        run: buildscripts/download-deps.sh

      - name: Build arm64 Fontconfig-enabled libmpvKt natives
        working-directory: .libmpvkt-src
        run: buildscripts/buildall.sh --arch arm64

      - name: Verify Fontconfig reached the build prefix
        working-directory: .libmpvkt-src
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc
          test -f buildscripts/prefix/arm64/lib/pkgconfig/libxml-2.0.pc
          grep -E '^Version:' buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc
          test -f libmpvkt-native/native-libs/arm64-v8a/libmpv.so
          test -f libmpvkt-native/native-libs/arm64-v8a/libmpvkt_jni.so

      - name: Record renderer build manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p fontconfig-native-probe
          cp .libmpvkt-src/buildscripts/include/depinfo.sh fontconfig-native-probe/depinfo.sh
          cp .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc fontconfig-native-probe/fontconfig.pc
          cp .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/libass.pc fontconfig-native-probe/libass.pc
          cp .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpv.so fontconfig-native-probe/
          cp .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpvkt_jni.so fontconfig-native-probe/

      - name: Upload arm64 probe
        uses: actions/upload-artifact@v4
        with:
          name: asswb-fontconfig-native-arm64
          path: fontconfig-native-probe/
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 21 for patched AAR packaging
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37 for libmpvKt packaging
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" >/dev/null

      - name: Give patched renderer an isolated Maven version
        working-directory: .libmpvkt-src
        run: |
          sed -i 's/^VERSION=.*/VERSION=0.3.0-asswb-fontconfig/' gradle.properties

      - name: Publish patched arm64 renderer AARs to a local Maven repository
        working-directory: .libmpvkt-src
        run: |
          ./gradlew \
            :libmpvkt-native:publishAllPublicationsToStaticRepository \
            :libmpvkt:publishAllPublicationsToStaticRepository \
            :libmpvkt-view:publishAllPublicationsToStaticRepository \
            :libmpvkt-compose:publishAllPublicationsToStaticRepository \
            -Plibmpvkt.abis=arm64-v8a \
            -Plibmpvkt.mavenRepoDir="$GITHUB_WORKSPACE/fontconfig-maven" \
            --no-configuration-cache

      - name: Build ASS Workbench experimental Fontconfig APK
        run: |
          gradle :app:assembleDebug \
            -Passwb.rendererRepo="$GITHUB_WORKSPACE/fontconfig-maven" \
            -Passwb.rendererVersion=0.3.0-asswb-fontconfig \
            -Passwb.rendererProvider=fontconfig \
            --stacktrace

      - name: Collect experimental APK and renderer manifest
        run: |
          mkdir -p fontconfig-experimental-apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            fontconfig-experimental-apk/ASS-Workbench-Android-0.15.1-fontconfig-arm64-debug.apk
          cp fontconfig-native-probe/depinfo.sh fontconfig-experimental-apk/
          cp fontconfig-native-probe/fontconfig.pc fontconfig-experimental-apk/
          cp fontconfig-native-probe/libass.pc fontconfig-experimental-apk/

      - name: Upload experimental Fontconfig APK
        uses: actions/upload-artifact@v4
        with:
          name: asswb-fontconfig-experimental-apk
          path: fontconfig-experimental-apk/
          if-no-files-found: error
          retention-days: 7
