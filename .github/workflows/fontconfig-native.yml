name: Fontconfig renderer native probe

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/libmpvkt-fontconfig/**'
      - '.github/workflows/fontconfig-native.yml'
      - 'core/fonts/**'
      - 'settings.gradle.kts'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/kotlin/io/github/assworkbench/app/**'

permissions:
  contents: read

jobs:
  arm64-fontconfig-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout ASS Workbench
        uses: actions/checkout@v4

      - name: Checkout pinned libmpvKt
        uses: actions/checkout@v4
        with:
          repository: yuroyami/libmpvKt
          ref: v0.3.0
          path: .libmpvkt-src

      - name: Patch libmpvKt for Fontconfig
        run: bash tools/libmpvkt-fontconfig/patch_upstream.sh .libmpvkt-src

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build nasm gperf python3-pip python3-jinja2
          python3 -m pip install --break-system-packages "meson==1.11.0"
          meson --version
          test "$(meson --version)" = "1.11.0"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          NDK_VERSION=29.0.14206865
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          if [ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
            echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          fi

      - name: Fetch pinned native sources
        working-directory: .libmpvkt-src
        run: buildscripts/download-deps.sh

      - name: Build arm64 Fontconfig-enabled libmpvKt natives
        working-directory: .libmpvkt-src
        run: buildscripts/buildall.sh --arch arm64

      - name: Verify Fontconfig reached the build prefix
        working-directory: .libmpvkt-src
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc
          test -f buildscripts/prefix/arm64/lib/pkgconfig/libxml-2.0.pc
          grep -E '^Version:' buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc
          test -f libmpvkt-native/native-libs/arm64-v8a/libmpv.so
          test -f libmpvkt-native/native-libs/arm64-v8a/libmpvkt_jni.so

      - name: Verify runtime DT_NEEDED dependencies
        working-directory: .libmpvkt-src
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d \
            libmpvkt-native/native-libs/arm64-v8a/libmpv.so | tee "$GITHUB_WORKSPACE/libmpv-needed.txt"
          if grep -E 'lib(fontconfig|xml2)\.so' "$GITHUB_WORKSPACE/libmpv-needed.txt"; then
            echo "Fontconfig/libxml2 unexpectedly remained dynamic and would be missing from the AAR" >&2
            exit 1
          fi

      - name: Record renderer build manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p fontconfig-native-probe
          cp .libmpvkt-src/buildscripts/include/depinfo.sh fontconfig-native-probe/depinfo.sh
          cp .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc fontconfig-native-probe/fontconfig.pc
          cp .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/libass.pc fontconfig-native-probe/libass.pc
          cp libmpv-needed.txt fontconfig-native-probe/
          cp .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpv.so fontconfig-native-probe/
          cp .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpvkt_jni.so fontconfig-native-probe/

          {
            echo "schema=1"
            echo "ass_workbench_commit=$GITHUB_SHA"
            echo "abi=arm64-v8a"
            echo "font_provider=fontconfig"
            echo "libmpvkt_upstream=v0.3.0"
            echo "libmpvkt_bundle_version=0.3.0-asswb-fontconfig"
            echo "meson=1.11.0"
            grep '^v_' .libmpvkt-src/buildscripts/include/depinfo.sh
            echo "fontconfig_pc_version=$(sed -nE 's/^Version:[[:space:]]*//p' .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc | head -1)"
            echo "libass_pc_version=$(sed -nE 's/^Version:[[:space:]]*//p' .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/libass.pc | head -1)"
            echo "libmpv_sha256=$(sha256sum .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpv.so | awk '{print $1}')"
            echo "jni_sha256=$(sha256sum .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpvkt_jni.so | awk '{print $1}')"
          } > fontconfig-native-probe/renderer-manifest.txt

      - name: Upload arm64 probe
        uses: actions/upload-artifact@v4
        with:
          name: asswb-fontconfig-native-arm64
          path: fontconfig-native-probe/
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 21 for patched AAR packaging
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 17 preview SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" --channel=3 >/dev/null

      - name: Give patched renderer an isolated Maven version
        working-directory: .libmpvkt-src
        run: |
          sed -i 's/^VERSION=.*/VERSION=0.3.0-asswb-fontconfig/' gradle.properties

      - name: Publish patched arm64 renderer AARs to a local Maven repository
        working-directory: .libmpvkt-src
        run: |
          ./gradlew \
            :libmpvkt-native:publishAllPublicationsToStaticRepository \
            :libmpvkt:publishAllPublicationsToStaticRepository \
            :libmpvkt-view:publishAllPublicationsToStaticRepository \
            :libmpvkt-compose:publishAllPublicationsToStaticRepository \
            -Plibmpvkt.abis=arm64-v8a \
            -Plibmpvkt.mavenRepoDir="$GITHUB_WORKSPACE/fontconfig-maven" \
            --no-configuration-cache

      - name: Verify isolated renderer Maven repository
        shell: bash
        run: |
          set -euxo pipefail
          test -f fontconfig-maven/io/github/yuroyami/libmpvkt-compose/0.3.0-asswb-fontconfig/libmpvkt-compose-0.3.0-asswb-fontconfig.pom
          test -f fontconfig-maven/io/github/yuroyami/libmpvkt-native/0.3.0-asswb-fontconfig/libmpvkt-native-0.3.0-asswb-fontconfig.pom
          find fontconfig-maven/io/github/yuroyami -maxdepth 4 -type f | sort | sed -n '1,120p'

      - name: Build ASS Workbench experimental Fontconfig APK
        run: |
          gradle :app:assembleDebug \
            -Passwb.rendererRepo="$GITHUB_WORKSPACE/fontconfig-maven" \
            -Passwb.rendererVersion=0.3.0-asswb-fontconfig \
            -Passwb.rendererProvider=fontconfig \
            --stacktrace

      - name: Collect experimental APK and renderer manifest
        run: |
          VERSION="$(sed -nE 's/^val baseVersionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          mkdir -p fontconfig-experimental-apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            "fontconfig-experimental-apk/ASS-Workbench-Android-$VERSION-fontconfig-arm64-debug.apk"
          cp fontconfig-native-probe/depinfo.sh fontconfig-experimental-apk/
          cp fontconfig-native-probe/fontconfig.pc fontconfig-experimental-apk/
          cp fontconfig-native-probe/libass.pc fontconfig-experimental-apk/
          cp fontconfig-native-probe/renderer-manifest.txt fontconfig-experimental-apk/
          cp fontconfig-native-probe/libmpv-needed.txt fontconfig-experimental-apk/

      - name: Upload experimental Fontconfig APK
        uses: actions/upload-artifact@v4
        with:
          name: asswb-fontconfig-experimental-apk
          path: fontconfig-experimental-apk/
          if-no-files-found: error
          retention-days: 7
