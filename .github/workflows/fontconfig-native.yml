name: Fontconfig renderer native probe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/libmpvkt-fontconfig/**'
      - 'tools/mkvgo/**'
      - '.github/workflows/fontconfig-native.yml'
      - 'core/domain/**'
      - 'core/fonts/**'
      - 'core/container/**'
      - 'settings.gradle.kts'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/kotlin/io/github/assworkbench/app/**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arm64-fontconfig-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout ASS Workbench
        uses: actions/checkout@v4

      - name: Validate Actions artifact policy
        run: python3 tools/check_artifact_policy.py

      - name: Checkout pinned mkvgo
        uses: actions/checkout@v4
        with:
          repository: gravity-zero/mkvgo
          ref: 085894ba0df6d14fb4dc4d41bab9aeb3283b3743
          path: .mkvgo-src

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Inject and test ASS Workbench MKV bridge
        shell: bash
        run: |
          set -euxo pipefail
          cp tools/mkvgo/ass_replace.go .mkvgo-src/mkv/ops/asswb_replace_ass.go
          cp tools/mkvgo/ass_replace_test.go .mkvgo-src/mkv/ops/asswb_replace_ass_test.go
          python3 tools/mkvgo/patch_upstream_writer.py
          mkdir -p .mkvgo-src/cmd/asswb-mkvgo
          cp tools/mkvgo/bridge_main.go .mkvgo-src/cmd/asswb-mkvgo/main.go
          (
            cd .mkvgo-src
            go test ./mkv/ops
          )

      - name: Build arm64 MKV write-back bridge
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          (
            cd .mkvgo-src
            CGO_ENABLED=0 GOOS=android GOARCH=arm64               go build -buildmode=pie -trimpath -ldflags="-s -w"               -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmkvgo.so" ./cmd/asswb-mkvgo
          )
          test -s app/src/main/jniLibs/arm64-v8a/libmkvgo.so
          file app/src/main/jniLibs/arm64-v8a/libmkvgo.so

      - name: Checkout pinned libmpvKt
        uses: actions/checkout@v4
        with:
          repository: yuroyami/libmpvKt
          ref: v0.3.0
          path: .libmpvkt-src

      - name: Patch libmpvKt for Fontconfig
        run: bash tools/libmpvkt-fontconfig/patch_upstream.sh .libmpvkt-src

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build nasm gperf python3-pip python3-jinja2
          python3 -m pip install --break-system-packages "meson==1.11.0"
          meson --version
          test "$(meson --version)" = "1.11.0"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          NDK_VERSION=29.0.14206865
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          if [ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            installed=false
            for attempt in 1 2 3; do
              echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
              if yes | "$SDKMANAGER" "ndk;$NDK_VERSION"; then
                installed=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$installed" != true ]; then
              echo "Failed to install pinned NDK $NDK_VERSION after 3 attempts" >&2
              exit 1
            fi
          fi
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"


      - name: Fetch pinned native sources
        working-directory: .libmpvkt-src
        run: buildscripts/download-deps.sh

      - name: Build arm64 Fontconfig-enabled libmpvKt natives
        working-directory: .libmpvkt-src
        run: buildscripts/buildall.sh --arch arm64

      - name: Verify Fontconfig reached the build prefix
        working-directory: .libmpvkt-src
        shell: bash
        run: |
          set -euxo pipefail
          test -f buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc
          test -f buildscripts/prefix/arm64/lib/pkgconfig/libxml-2.0.pc
          grep -E '^Version:' buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc
          test -f libmpvkt-native/native-libs/arm64-v8a/libmpv.so
          test -f libmpvkt-native/native-libs/arm64-v8a/libmpvkt_jni.so

      - name: Verify runtime DT_NEEDED dependencies
        working-directory: .libmpvkt-src
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d \
            libmpvkt-native/native-libs/arm64-v8a/libmpv.so | tee "$GITHUB_WORKSPACE/libmpv-needed.txt"
          if grep -E 'lib(fontconfig|xml2)\.so' "$GITHUB_WORKSPACE/libmpv-needed.txt"; then
            echo "Fontconfig/libxml2 unexpectedly remained dynamic and would be missing from the AAR" >&2
            exit 1
          fi

      - name: Record renderer build manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p fontconfig-native-probe
          cp .libmpvkt-src/buildscripts/include/depinfo.sh fontconfig-native-probe/depinfo.sh
          cp .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc fontconfig-native-probe/fontconfig.pc
          cp .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/libass.pc fontconfig-native-probe/libass.pc
          cp libmpv-needed.txt fontconfig-native-probe/
          cp .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpv.so fontconfig-native-probe/
          cp .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpvkt_jni.so fontconfig-native-probe/

          {
            echo "schema=1"
            echo "ass_workbench_commit=$GITHUB_SHA"
            echo "abi=arm64-v8a"
            echo "font_provider=fontconfig"
            echo "libmpvkt_upstream=v0.3.0"
            echo "libmpvkt_bundle_version=0.3.0-asswb-fontconfig"
            echo "meson=1.11.0"
            grep '^v_' .libmpvkt-src/buildscripts/include/depinfo.sh
            echo "fontconfig_pc_version=$(sed -nE 's/^Version:[[:space:]]*//p' .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/fontconfig.pc | head -1)"
            echo "libass_pc_version=$(sed -nE 's/^Version:[[:space:]]*//p' .libmpvkt-src/buildscripts/prefix/arm64/lib/pkgconfig/libass.pc | head -1)"
            echo "libmpv_sha256=$(sha256sum .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpv.so | awk '{print $1}')"
            echo "jni_sha256=$(sha256sum .libmpvkt-src/libmpvkt-native/native-libs/arm64-v8a/libmpvkt_jni.so | awk '{print $1}')"
          } > fontconfig-native-probe/renderer-manifest.txt

      - name: Upload one-day manual arm64 probe
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: asswb-fontconfig-native-arm64-manual
          path: fontconfig-native-probe/
          if-no-files-found: error
          retention-days: 1

      - name: Set up JDK 21 for patched AAR packaging
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install stable Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Give patched renderer an isolated Maven version
        working-directory: .libmpvkt-src
        run: |
          sed -i 's/^VERSION=.*/VERSION=0.3.0-asswb-fontconfig/' gradle.properties

      - name: Publish patched arm64 renderer AARs to a local Maven repository
        working-directory: .libmpvkt-src
        run: |
          ./gradlew \
            :libmpvkt-native:publishAllPublicationsToStaticRepository \
            :libmpvkt:publishAllPublicationsToStaticRepository \
            :libmpvkt-view:publishAllPublicationsToStaticRepository \
            :libmpvkt-compose:publishAllPublicationsToStaticRepository \
            -Plibmpvkt.abis=arm64-v8a \
            -Plibmpvkt.mavenRepoDir="$GITHUB_WORKSPACE/fontconfig-maven" \
            --no-configuration-cache

      - name: Verify isolated renderer Maven repository
        shell: bash
        run: |
          set -euxo pipefail
          test -f fontconfig-maven/io/github/yuroyami/libmpvkt-compose/0.3.0-asswb-fontconfig/libmpvkt-compose-0.3.0-asswb-fontconfig.pom
          test -f fontconfig-maven/io/github/yuroyami/libmpvkt-native/0.3.0-asswb-fontconfig/libmpvkt-native-0.3.0-asswb-fontconfig.pom
          find fontconfig-maven/io/github/yuroyami -maxdepth 4 -type f | sort | sed -n '1,120p'

      - name: Run ASS Workbench release-gate unit tests
        run: gradle :core:domain:test :core:fonts:test :core:container:test --stacktrace

      - name: Build ASS Workbench production Fontconfig APK
        run: |
          gradle :app:assembleDebug \
            -Passwb.rendererRepo="$GITHUB_WORKSPACE/fontconfig-maven" \
            -Passwb.rendererVersion=0.3.0-asswb-fontconfig \
            -Passwb.rendererProvider=fontconfig \
            -Passwb.rendererExperimental=false \
            --stacktrace

      - name: Collect and verify production APK identity
        run: |
          set -euxo pipefail
          VERSION="$(sed -nE 's/^val baseVersionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          BUILD_CONFIG="app/build/generated/source/buildConfig/debug/io/github/assworkbench/app/BuildConfig.java"
          test -f "$BUILD_CONFIG"
          grep -Fq "VERSION_CODE = $VERSION_CODE" "$BUILD_CONFIG"
          grep -Fq "VERSION_NAME = \"$VERSION\"" "$BUILD_CONFIG"
          grep -Fq "ASSWB_BUILD_COMMIT = \"$SHORT_SHA\"" "$BUILD_CONFIG"
          grep -Fq "ASSWB_BUILD_NUMBER = \"$GITHUB_RUN_NUMBER\"" "$BUILD_CONFIG"
          grep -Fq "ASSWB_RENDERER_FONT_PROVIDER = \"fontconfig\"" "$BUILD_CONFIG"
          grep -Fq "ASSWB_RENDERER_VERSION = \"0.3.0-asswb-fontconfig\"" "$BUILD_CONFIG"

          APK_RAW="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_RAW"
          unzip -l "$APK_RAW" | grep -q 'lib/arm64-v8a/libmkvgo.so'

          mkdir -p fontconfig-production-apk
          APK="ASS-Workbench-Android-$VERSION-$SHORT_SHA-debug.apk"
          IDENTITY="ASS-Workbench-Android-$VERSION-$SHORT_SHA-build-identity.txt"
          FIXTURES="ASS-Workbench-Android-$VERSION-$SHORT_SHA-device-fixtures.zip"
          cp app/build/outputs/apk/debug/app-debug.apk "fontconfig-production-apk/$APK"
          python3 tools/generate_device_fixtures.py fontconfig-production-apk/device-fixtures-0.27
          (
            cd fontconfig-production-apk
            zip -qr "$FIXTURES" device-fixtures-0.27
          )
          {
            echo "schema=1"
            echo "version_name=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "commit=$GITHUB_SHA"
            echo "short_commit=$SHORT_SHA"
            echo "workflow=Fontconfig renderer native probe"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "run_id=$GITHUB_RUN_ID"
            echo "renderer_provider=fontconfig"
            echo "renderer_version=0.3.0-asswb-fontconfig"
            echo "mkv_bridge_abi=arm64-v8a"
            echo "mkv_bridge_sha256=$(sha256sum app/src/main/jniLibs/arm64-v8a/libmkvgo.so | awk '{print $1}')"
            echo "apk_name=$APK"
            echo "apk_sha256=$(sha256sum "fontconfig-production-apk/$APK" | awk '{print $1}')"
            echo "device_fixtures_name=$FIXTURES"
            echo "device_fixtures_sha256=$(sha256sum "fontconfig-production-apk/$FIXTURES" | awk '{print $1}')"
            echo "device_fixture_manifest_sha256=$(sha256sum fontconfig-production-apk/device-fixtures-0.27/manifest.txt | awk '{print $1}')"
            echo "renderer_manifest_sha256=$(sha256sum fontconfig-native-probe/renderer-manifest.txt | awk '{print $1}')"
          } > "fontconfig-production-apk/$IDENTITY"

          cp fontconfig-native-probe/depinfo.sh fontconfig-production-apk/
          cp fontconfig-native-probe/fontconfig.pc fontconfig-production-apk/
          cp fontconfig-native-probe/libass.pc fontconfig-production-apk/
          cp fontconfig-native-probe/renderer-manifest.txt fontconfig-production-apk/
          cp fontconfig-native-probe/libmpv-needed.txt fontconfig-production-apk/

      - name: Upload one-day manual production bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: asswb-fontconfig-production-manual
          path: fontconfig-production-apk/
          if-no-files-found: error
          retention-days: 1

      - name: Publish canonical GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(sed -nE 's/^val baseVersionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          TAG="v$VERSION"
          APK="fontconfig-production-apk/ASS-Workbench-Android-$VERSION-$SHORT_SHA-debug.apk"
          IDENTITY="fontconfig-production-apk/ASS-Workbench-Android-$VERSION-$SHORT_SHA-build-identity.txt"
          FIXTURES="fontconfig-production-apk/ASS-Workbench-Android-$VERSION-$SHORT_SHA-device-fixtures.zip"
          NOTES="Rolling $VERSION construction prerelease. Canonical device-test APK built from commit $GITHUB_SHA (Actions run #$GITHUB_RUN_NUMBER). The version tag marks the construction milestone and may predate the rolling APK assets; exact provenance is carried by the SHA-bearing APK filename, the in-app Diagnostics identity, the build-identity manifest, and the deterministic device-fixture bundle."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Do not let an empty previous-asset match abort the job under pipefail.
            # Also retire the old unsuffixed APK because it cannot identify its source commit.
            while IFS= read -r asset; do
              gh release delete-asset "$TAG" "$asset" -y
            done < <(
              gh release view "$TAG" --json assets --jq '.assets[].name' | \
                grep -E "^ASS-Workbench-Android-$VERSION-([0-9a-f]{12}-)?(debug\\.apk|build-identity\\.txt|device-fixtures\\.zip)$" || true
            )
            gh release upload "$TAG" "$APK" "$IDENTITY" "$FIXTURES"
            gh release edit "$TAG" \
              --title "ASS Workbench Android $VERSION" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" "$IDENTITY" "$FIXTURES" \
              --target "$GITHUB_SHA" \
              --title "ASS Workbench Android $VERSION" \
              --prerelease \
              --notes "$NOTES"
          fi

          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "ASS-Workbench-Android-$VERSION-$SHORT_SHA-debug.apk" <<<"$ASSETS"
          grep -Fxq "ASS-Workbench-Android-$VERSION-$SHORT_SHA-build-identity.txt" <<<"$ASSETS"
          grep -Fxq "ASS-Workbench-Android-$VERSION-$SHORT_SHA-device-fixtures.zip" <<<"$ASSETS"
          if grep -Fxq "ASS-Workbench-Android-$VERSION-debug.apk" <<<"$ASSETS"; then
            echo "Legacy ambiguous release APK still present" >&2
            exit 1
          fi
